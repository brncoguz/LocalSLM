version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Grouped so a quiet week produces one PR rather than six.
    groups:
      python-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
