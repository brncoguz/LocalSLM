name: Integration (correctness only)

# Runs the tests that need a real Ollama server, against a real model.
#
# This is NOT a benchmark and must never be read as one. A GitHub runner is
# shared and virtualised, so any tok/s or latency it produces describes the
# runner's current neighbours, not the model. What this checks is that the
# adapter still speaks Ollama correctly: streaming, /api/ps, capability
# detection, the thinking/answer split.
#
# Not on every push — each run pulls model weights, and macOS runner
# concurrency is limited.

on:
  schedule:
    - cron: "22 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live Ollama
    # Apple Silicon, matching the platform the project targets.
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      # Smallest useful model: this verifies the protocol, not the model.
      OLLAMA_MODEL: llama3.2:1b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Ollama
        run: brew install ollama

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama
        run: |
          ollama serve &
          # Poll rather than sleep: the server is usually up in under a second,
          # and a fixed sleep either wastes time or flakes.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/version || { echo "Ollama did not start"; exit 1; }

      - name: Pull model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Run integration tests
        env:
          PYTHONPATH: src
        run: pytest -q -m integration
