name: Demo

# Publishes a static build of the dashboard, served from a fixture of real
# measurements committed to the repo (`make demo-data`).
#
# The demo exists because nobody is going to install Ollama and pull several
# gigabytes of weights to look at a dashboard. It renders recorded data and says
# so on every screen — it does not, and cannot, run a model.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build demo
        working-directory: ui
        # VITE_DEMO switches the API client to the fixture and sets the
        # /LocalSLM/ base path Pages serves from.
        env:
          VITE_DEMO: "1"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
