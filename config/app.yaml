# Everything that changes benchmark behaviour lives here, not in code.
# A study is a preset selection; adding one must never mean adding a branch.

ollama:
  host: http://localhost:11434
  # How long Ollama keeps weights resident after a request. Benchmarks manage
  # this explicitly so cold-vs-warm is a measurement, not an accident.
  keep_alive: 5m
  request_timeout_s: 600

chat:
  default_model: qwen3.5:4b
  options:
    temperature: 0.7
    top_p: 0.95
  # Compare mode fans one prompt out to several models. On 16 GB, loading two
  # 9B models at once swaps; the runner checks headroom and falls back.
  compare_max_models: 4
  compare_memory_headroom_gb: 2.0

telemetry:
  sample_interval_s: 0.25
  # Energy metrics shell out to `sudo powermetrics`. Off by default so the app
  # never surprises anyone with a password prompt.
  powermetrics: false

bench:
  warmup_iterations: 1      # discarded — the first pass pays load and page-in costs
  repeats: 3
  bootstrap_samples: 2000
  confidence: 0.95
  # Abort a run rather than publish numbers taken while the machine was swapping.
  abort_on_memory_pressure_pct: 20
  # Interleave model order across repeats so one model isn't the only one running hot.
  interleave_models: true

judge:
  backend: local           # local | claude
  local_model: qwen3.5:9b
  claude_model: claude-opus-5
  swap_order: true         # cancel position bias by scoring each pair both ways

presets:
  quick:
    bench.repeats: 1
    bench.warmup_iterations: 1
    bench.suites: [extract_json, ifeval]
    bench.think_levels: [false]
  standard:
    bench.repeats: 3
    bench.suites: [extract_json, ifeval, grounded_qa, classify, math]
    bench.think_levels: [false, true]
  full:
    bench.repeats: 5
    bench.suites: [extract_json, ifeval, grounded_qa, classify, math, code, refusal, tr_basic]
    bench.think_levels: [false, low, medium, high]
  quant_ladder:
    bench.repeats: 3
    bench.models: [qwen3.5:4b, qwen3.5:4b-q8_0, qwen3.5:4b-bf16]
    bench.suites: [extract_json, grounded_qa, math]
  thinking_sweep:
    bench.repeats: 3
    bench.think_levels: [false, low, medium, high]
    bench.suites: [extract_json, classify, math]
